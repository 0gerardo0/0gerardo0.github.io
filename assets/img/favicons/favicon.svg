<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0a0d12"/>
    </linearGradient>
    <linearGradient id="xGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border -->
  <rect x="12" y="12" width="488" height="488" rx="108" fill="none" stroke="#30363d" stroke-width="6" opacity="0.8"/>

  <!-- Terminal 0x0 mark -->
  <g filter="url(#glow)">
    <text x="50%" y="54%" 
          font-family="JetBrains Mono, Hack, monospace" 
          font-size="208" 
          font-weight="900" 
          text-anchor="middle" 
          dominant-baseline="central" 
          letter-spacing="-8">
      <tspan fill="#f0f6fc">0</tspan><tspan fill="url(#xGrad)">x</tspan><tspan fill="#f0f6fc">0</tspan>
    </text>
  </g>
</svg>
