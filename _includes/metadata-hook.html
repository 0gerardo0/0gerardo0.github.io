<!-- A placeholder to allow defining custom metadata -->

{%- if site.adsense.client and site.adsense.client != "ca-pub-XXXXXXXXXXXXXXXX" -%}
  <!-- Google AdSense: verificación de propiedad -->
  <meta name="google-adsense-account" content="{{ site.adsense.client }}">

  {%- if site.adsense.enabled -%}
    <!-- Google AdSense -->
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client={{ site.adsense.client }}"
      crossorigin="anonymous"
    ></script>
  {%- endif -%}
{%- endif -%}
